name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect every APK into one folder
        run: |
          mkdir -p release-apks
          echo "=== Searching entire workspace for APKs ==="
          find . -name "*.apk" -type f -print
          # Copy every APK found (except the gradle wrapper / caches)
          find . -name "*.apk" -type f ! -path "./.gradle/*" ! -path "./gradle/*" -exec cp -v {} release-apks/ \;
          echo "=== Collected ==="
          ls -la release-apks/
          # Fail only if nothing was collected
          test "$(ls -A release-apks/ 2>/dev/null)" || (echo "NO APKs FOUND ANYWHERE" && exit 1)

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swarmbuilder-apks
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v1.0.{0}', github.run_number) || github.ref_name }}
          name: SwarmBuilder ${{ github.event_name == 'workflow_dispatch' && format('build {0}', github.run_number) || github.ref_name }}
          generate_release_notes: true
          files: release-apks/*.apk
          fail_on_unmatched_files: false
