name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APKs
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace --info 2>&1 | tee build.log
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Show build log tail on failure
        if: failure()
        run: tail -n 200 build.log || true

      - name: Find and list all APKs
        if: always()
        run: |
          echo "=== Searching for APKs ==="
          find . -name "*.apk" -type f 2>/dev/null | head -50
          mkdir -p artifacts
          find app/build/outputs -name "*.apk" -type f -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts/ || echo "No APKs copied"

      - name: Upload APKs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarmbuilder-apks
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v1.0.{0}', github.run_number) || github.ref_name }}
          name: SwarmBuilder ${{ github.event_name == 'workflow_dispatch' && format('build {0}', github.run_number) || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.apk
          fail_on_unmatched_files: false
