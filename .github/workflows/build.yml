name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          echo "=== Expected app output ==="
          find app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true
          echo "=== All APKs in workspace ==="
          find . -type f -name '*.apk' -not -path './.gradle/*' -not -path './gradle/*' -print
          mapfile -t apks < <(find . -type f -name '*.apk' -not -path './.gradle/*' -not -path './gradle/*' -print)
          if (( ${#apks[@]} == 0 )); then
            echo 'ERROR: Gradle completed but produced no APK anywhere.'
            echo '=== app/build/outputs tree ==='
            find app/build/outputs -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp -v "$apk" release-apks/
          done
          echo "=== Collected APKs ==="
          ls -lah release-apks
          test -n "$(find release-apks -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 14
