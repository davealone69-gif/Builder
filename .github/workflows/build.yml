name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect every APK into one folder
        run: |
          mkdir -p release-apks
          echo "=== Searching entire workspace for APKs ==="
          find . -name "*.apk" -type f -print
          find . -name "*.apk" -type f ! -path "./.gradle/*" ! -path "./gradle/*" -exec cp -v {} release-apks/ \;
          echo "=== Collected ==="
          ls -la release-apks/
          test "$(ls -A release-apks/ 2>/dev/null)" || (echo "NO APKs FOUND ANYWHERE" && exit 1)

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 14
