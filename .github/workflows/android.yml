name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses + install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build APKs and AAB
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Verify and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          mapfile -t apks < <(find app/build/outputs -type f -name '*.apk' -print)
          mapfile -t aabs < <(find app/build/outputs -type f -name '*.aab' -print)
          (( ${#apks[@]} > 0 )) || { echo "ERROR: no APK produced"; exit 1; }
          (( ${#aabs[@]} > 0 )) || { echo "ERROR: no AAB produced"; exit 1; }
          for f in "${apks[@]}" "${aabs[@]}"; do cp -v "$f" release-artifacts/; done
          ls -lah release-artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swarmbuilder-android-artifacts
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: swarmbuilder-android-artifacts
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v1.1.{0}', github.run_number) || github.ref_name }}
          name: SwarmBuilder ${{ github.event_name == 'workflow_dispatch' && format('build {0}', github.run_number) || github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
          fail_on_unmatched_files: true
