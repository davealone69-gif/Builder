name: Build & Release APK

# Single workflow that replaces the old "Build APK" + "Build and Release APK"
# + "CI Status" trio:
#   * every push/PR to main  -> build debug APK, upload as artifact
#   * push of tag v*         -> build debug + release APKs, attach to a GitHub Release
#   * manual dispatch        -> same as a tag push (tag is named automatically)
#
# Key hardening vs the old version:
#   * Gradle exit code is NEVER masked (no `| tee` without checking PIPESTATUS)
#   * the job FAILS LOUDLY if no APK is produced  ->  no more green-but-empty releases
#   * release step has fail_on_unmatched_files: true
#   * concurrency cancels stale runs when pushing rapidly

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          echo "=== Expected app output ==="
          find app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true
          echo "=== All APKs in workspace ==="
          find . -type f -name '*.apk' -not -path './.gradle/*' -not -path './gradle/*' -print
          mapfile -t apks < <(find . -type f -name '*.apk' -not -path './.gradle/*' -not -path './gradle/*' -print)
          if (( ${#apks[@]} == 0 )); then
            echo 'ERROR: Gradle completed but produced no APK anywhere.'
            find app/build/outputs -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp -v "$apk" release-apks/
          done
          echo "=== Collected APKs ==="
          ls -lah release-apks
          test -n "$(find release-apks -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swarmbuilder-apks
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APKs
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v1.1.{0}', github.run_number) || github.ref_name }}
          name: SwarmBuilder ${{ github.event_name == 'workflow_dispatch' && format('build {0}', github.run_number) || github.ref_name }}
          generate_release_notes: true
          files: release-apks/*.apk
          fail_on_unmatched_files: true
