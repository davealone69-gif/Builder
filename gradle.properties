# Project-wide Gradle settings.

# Enables AndroidX support (required — the project uses AndroidX libraries)
android.useAndroidX=true
# android.enableJetifier removed: every dependency is AndroidX-native, and
# Jetifier only slows the build down.

# Faster builds: don't expose transitive library R classes to the app
android.nonTransitiveRClass=true

# Optional performance / memory tweaks for CI
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
